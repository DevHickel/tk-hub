# Rate limiting básico por IP
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

server {
    listen 80;
    server_name sistema.tksolution.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sistema.tksolution.com.br;

    # SSL — gerenciado pelo Certbot (setup-vps.sh)
    ssl_certificate     /etc/letsencrypt/live/sistema.tksolution.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistema.tksolution.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Tamanho máximo de upload — PDFs (security/SKILL.md §3)
    client_max_body_size 25M;

    # Gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # /api/* → backend Hono na porta 3000
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # /health → backend
    location /health {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
    }

    # /* → frontend estático na porta 4000
    location / {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
